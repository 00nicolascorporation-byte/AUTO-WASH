<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Gestão Executiva para Estética Automotiva">
  <title>Gestão Executiva | Estética Automotiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>
<div id="loginGate" style="position:fixed;inset:0;z-index:999;background:#101214;display:grid;place-items:center;padding:20px">
<div style="width:min(410px,100%);background:#181b1f;border:1px solid #30353c;border-radius:16px;padding:30px;box-shadow:0 30px 80px #0008">
<div style="text-align:center;margin-bottom:24px"><div style="font-weight:800;color:#ff9844;font-size:24px">AE</div><b>AUTO EXECUTIVE</b><div style="font-size:9px;color:#8b929b;letter-spacing:.2em">GESTÃO</div></div>
<h2 style="text-align:center;font-size:19px">Acesso ao sistema</h2><p style="text-align:center;color:#9ba2ab;font-size:11px">Entre com sua matrícula e senha.</p>
<form id="loginForm"><label style="font-size:10px;color:#9ba2ab">Matrícula<input id="loginMatricula" required placeholder="000001" style="display:block;margin:6px 0 13px;width:100%"></label><label style="font-size:10px;color:#9ba2ab">Senha<input id="loginPassword" type="password" required style="display:block;margin:6px 0 13px;width:100%"></label><button class="btn primary" style="width:100%">Entrar</button><div id="loginError" style="min-height:20px;color:#e25555;font-size:10px;text-align:center;margin-top:10px"></div></form>
<div style="font-size:9px;color:#707983;text-align:center">Acesso online preparado para múltiplos dispositivos.</div></div></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AE</div>
        <div><strong id="brandName">AUTO EXECUTIVE</strong><span>GESTÃO</span></div>
      </div>
      <nav id="mainNav">
        <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button>
        <div class="nav-label">OPERAÇÃO</div>
        <button class="nav-item" data-page="orders"><i data-lucide="clipboard-list"></i><span>Ordens de Serviço</span></button>
        <button class="nav-item" data-page="services"><i data-lucide="sparkles"></i><span>Serviços</span></button>
        <button class="nav-item" data-page="clients"><i data-lucide="users"></i><span>Clientes</span></button>
        <button class="nav-item" data-page="vehicles"><i data-lucide="car-front"></i><span>Veículos</span></button>
        <div class="nav-label">ESTOQUE</div>
        <button class="nav-item" data-page="products"><i data-lucide="package"></i><span>Produtos</span></button>
        <button class="nav-item" data-page="inventory"><i data-lucide="boxes"></i><span>Estoque</span></button>
        <button class="nav-item" data-page="purchases"><i data-lucide="shopping-cart"></i><span>Compras</span></button>
        <div class="nav-label">EQUIPE</div>
        <button class="nav-item" data-page="employees"><i data-lucide="hard-hat"></i><span>Funcionários</span></button>
        <button class="nav-item" data-page="hours"><i data-lucide="clock-3"></i><span>Horas</span></button>
        <button class="nav-item" data-page="machines"><i data-lucide="settings-2"></i><span>Máquinas</span></button>
        <div class="nav-label">FINANCEIRO</div>
        <button class="nav-item" data-page="finance"><i data-lucide="wallet-cards"></i><span>Financeiro</span></button>
        <button class="nav-item" data-page="investments"><i data-lucide="trending-up"></i><span>Investimentos</span></button>
        <button class="nav-item" data-page="goals"><i data-lucide="target"></i><span>Metas</span></button>
        <div class="nav-label">ANÁLISES</div>
        <button class="nav-item" data-page="reports"><i data-lucide="file-chart-column"></i><span>Relatórios</span></button>
        <button class="nav-item" data-page="settings"><i data-lucide="sliders-horizontal"></i><span>Configurações</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item" id="demoBtn"><i data-lucide="database"></i><span>Carregar demonstração</span></button>
        <button class="nav-item danger-link" id="clearBtn"><i data-lucide="trash-2"></i><span>Limpar dados</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn"><i data-lucide="menu"></i></button>
        <div class="crumb"><span id="pageKicker">VISÃO EXECUTIVA</span><strong id="pageTitle">Dashboard</strong></div>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" title="Alternar tema"><i data-lucide="moon"></i></button>
          <button class="icon-btn" id="backupBtn" title="Exportar backup"><i data-lucide="download"></i></button>
          <label class="icon-btn" title="Importar backup"><i data-lucide="upload"></i><input id="restoreInput" type="file" accept=".json" hidden></label>
          <div class="avatar">AE</div>
        </div>
      </header>
      <section class="content" id="app"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast-stack" id="toastStack"></div>
  <script src="js/app.js"></script>
</body>
</html>
